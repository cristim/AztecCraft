[package]
name = "macos-quit-menu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "Routes macOS application termination (Quit, Dock Quit, logout, shutdown) through the window close guard"

[[test]]
name = "terminate_hook"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSEnumerator", "NSGeometry"] }
dispatch2 = "=0.3.1"
