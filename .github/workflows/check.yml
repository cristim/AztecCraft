name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  gpu:
    name: Software Vulkan viewport
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      AZTECCRAFT_SOFTWARE_GPU: "1"
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native and software Vulkan dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Select installed software Vulkan manifest
        shell: python
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          package = "mesa-vulkan-drivers"
          files = subprocess.check_output(["dpkg-query", "--listfiles", package], text=True).splitlines()
          manifests = [Path(path) for path in files if re.fullmatch(r"/usr/share/vulkan/icd\.d/lvp_icd(?:\.[A-Za-z0-9_]+)?\.json", path)]
          if len(manifests) != 1:
              raise SystemExit(f"Expected one package-owned Lavapipe manifest, found {len(manifests)}")
          manifest = manifests[0]
          if manifest.is_symlink() or not manifest.is_file() or not os.access(manifest, os.R_OK):
              raise SystemExit("Lavapipe manifest must be a readable regular file")
          version = subprocess.check_output(["dpkg-query", "--show", "--showformat=${Version}", package], text=True)
          print(f"{package} {version}: {manifest}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"VK_ICD_FILENAMES={manifest}\n")
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Actual renderer framebuffer and editor integration proofs
        run: cargo +1.99.0 test --locked --bin azteccraft --features mcp-test-client headless_gpu -- --ignored --test-threads=1
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: azteccraft
            arch: x86_64
          - os: windows-2025
            platform: windows
            binary: azteccraft.exe
            arch: x86_64
          - os: macos-15
            platform: macos
            binary: azteccraft
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned pip
        run: python -m pip install pip==26.2.1
      - name: Install packaging check tools
        run: python -m pip install --group packaging/pyproject.toml:dev
      - name: Packaging lint
        run: python -m ruff check --config packaging/pyproject.toml packaging
      - name: Packaging format
        run: python -m ruff format --check --config packaging/pyproject.toml packaging
      - name: Packaging types
        run: python -m mypy --config-file packaging/pyproject.toml packaging/package.py packaging/tests
      - name: Packaging tests
        run: python -m pytest -c packaging/pyproject.toml packaging/tests
      - name: Install pinned Rust
        shell: bash
        # Runner images sometimes ship a partial 1.99.0 install, so rustup reports
        # "detected conflict: bin/cargo-clippy"; reinstall the toolchain once from scratch.
        run: |
          install() { rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt; }
          install || { rustup toolchain uninstall 1.99.0 && install; }
      - name: Format
        run: cargo +1.99.0 fmt --all -- --check
      - name: Vendored atomic format
        run: cargo +1.99.0 fmt --manifest-path vendor/craft-atomic/Cargo.toml --all -- --check
      - name: Vendored atomic Clippy
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo +1.99.0 clippy --manifest-path vendor/craft-atomic/Cargo.toml --all-targets --locked -- -D warnings
      - name: Vendored atomic tests and docs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo +1.99.0 test --manifest-path vendor/craft-atomic/Cargo.toml --locked
      - name: macOS quit menu format
        if: matrix.platform == 'macos'
        run: cargo +1.99.0 fmt --manifest-path crates/macos-quit-menu/Cargo.toml --all -- --check
      - name: macOS quit menu Clippy
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo +1.99.0 clippy --manifest-path crates/macos-quit-menu/Cargo.toml --all-targets --locked -- -D warnings
      - name: macOS quit menu tests
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo +1.99.0 test --manifest-path crates/macos-quit-menu/Cargo.toml --locked
      - name: macOS quit menu compiles elsewhere
        if: matrix.platform == 'linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo +1.99.0 check --manifest-path crates/macos-quit-menu/Cargo.toml --all-targets --locked
      - name: Clippy
        run: cargo +1.99.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.99.0 test --workspace --locked
      - name: MCP production Clippy
        run: cargo +1.99.0 clippy --workspace --all-targets --locked --features mcp -- -D warnings
      - name: MCP client-test Clippy
        run: cargo +1.99.0 clippy --workspace --all-targets --locked --features mcp-test-client -- -D warnings
      - name: MCP official client and editor tests
        run: cargo +1.99.0 test --workspace --locked --features mcp-test-client
      - name: MCP production build
        run: cargo +1.99.0 build --workspace --locked --features mcp
      - name: Install LLVM tools
        if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview --toolchain 1.99.0
      - name: Install coverage tool
        if: runner.os == 'Linux'
        run: cargo +1.99.0 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Headless library line coverage (80% minimum)
        if: runner.os == 'Linux'
        run: cargo +1.99.0 llvm-cov --no-default-features --workspace --all-targets --locked --ignore-filename-regex '(^|/)tests/' --fail-under-lines 80
      - name: Release build
        run: cargo +1.99.0 build --workspace --release --locked
      - name: Package built desktop binary
        run: python packaging/package.py --binary target/release/${{ matrix.binary }} --output target/packages --platform ${{ matrix.platform }}
      - name: Smoke-check packaged binary
        run: python packaging/smoke_check.py --packages target/packages --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --run
      - name: Upload checked build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azteccraft-${{ matrix.platform }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/packages/*.zip
            target/packages/*.tar.gz
            target/packages/manifest.json
          if-no-files-found: error
          retention-days: 7
  macos-x86_64:
    name: Build macOS x86_64 (cross-compiled)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        shell: bash
        # Same partial-install retry as the check job.
        run: |
          install() { rustup toolchain install 1.99.0 --profile minimal --target x86_64-apple-darwin; }
          install || { rustup toolchain uninstall 1.99.0 && install; }
      - name: Release build
        run: cargo +1.99.0 build --release --locked --bin azteccraft --target x86_64-apple-darwin
      - name: Package built desktop binary
        run: python packaging/package.py --binary target/x86_64-apple-darwin/release/azteccraft --output target/packages --platform macos
      - name: Smoke-check packaged binary
        # Built for a different CPU than the runner, so check architecture and mode without running it.
        run: python packaging/smoke_check.py --packages target/packages --platform macos --arch x86_64
      - name: Upload checked build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azteccraft-macos-x86_64-${{ github.sha }}
          path: |
            target/packages/*.zip
            target/packages/manifest.json
          if-no-files-found: error
          retention-days: 7
  audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned cargo-audit
        run: cargo +1.99.0 install cargo-audit --version 0.22.0 --locked
      - name: Audit locked dependencies
        run: cargo +1.99.0 audit --deny warnings
