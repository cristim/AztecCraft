[package]
name = "azteccraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]
mcp = ["desktop", "dep:rmcp", "dep:tokio", "dep:tokio-util", "dep:futures-util"]
mcp-test-client = ["mcp", "rmcp/client"]

[[bin]]
name = "azteccraft"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "icon_sheet"
path = "examples/icon_sheet.rs"
required-features = ["desktop"]

[dependencies]
glam = { version = "=0.34.1", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
craft-atomic = { path = "vendor/craft-atomic" }
nom = "=8.0.0"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
rfd = { version = "=0.17.2", optional = true }
uuid = { version = "=1.28.0", features = ["v4"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "=1.53.3", features = ["rt", "macros", "sync", "time", "io-std", "io-util"], optional = true }
tokio-util = { version = "=0.7.20", features = ["codec", "rt"], optional = true }
futures-util = { version = "=0.3.34", features = ["sink"], optional = true }

[dev-dependencies]
pollster = "=1.0.1"
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
macos-quit-menu = { path = "crates/macos-quit-menu" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
signal-hook = { version = "=0.4.5", default-features = false, features = ["iterator"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
